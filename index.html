<!DOCTYPE html>
<html lang="ko">
<head>

  <title>고려 역사 인물 탐험 | 5학년 역사 조사</title>
  <!-- 나눔스퀘어라운드 웹폰트: 인터넷이 안 되면 시스템 글꼴로 표시됩니다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kingyong9169/NanumSquareRound/NanumSquareRound.css" />
  <style>
    :root {
      --bg: #f8f6f0;
      --paper: #fffdf9;
      --ink: #223449;
      --muted: #627080;
      --line: #e4dfd4;
      --brand: #335c64;
      --deep-brand: #24464e;
      --accent: #c88d54;
      --focus: #196caa;
      --shadow: 0 14px 35px rgba(50, 59, 55, .08);
      --font: 'Nanum Square Round', 'NanumSquareRound', 'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.75;
      word-break: keep-all;
      background: radial-gradient(circle at 96% 0, #efe9db 0, transparent 27%), var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    button { font: inherit; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip { position: absolute; z-index: 10; left: 20px; top: -70px; padding: 10px 16px; border-radius: 8px; color: white; background: var(--deep-brand); }
    .skip:focus { top: 10px; }
    .site-header { position: relative; z-index: 2; border-bottom: 1px solid var(--line); background: rgba(255, 253, 248, .94); }
    .header-inner { width: min(1160px, calc(100% - 40px)); margin: 0 auto; min-height: 86px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: inline-flex; gap: 13px; align-items: center; text-decoration: none; }
    .brand-mark { display: grid; place-items: center; flex: 0 0 43px; height: 43px; border-radius: 13px; background: var(--deep-brand); color: #fff4d7; font-weight: 900; font-size: 23px; line-height: 1; box-shadow: inset 0 0 0 2px #46626a; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.35; }
    .brand-text strong { font-size: 20px; letter-spacing: -.06em; }
    .brand-text small { font-weight: 700; font-size: 12px; letter-spacing: .035em; color: #7c7a70; }
    .header-note { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; color: #5b6b69; border: 1px solid #d6e2de; background: #edf3ef; border-radius: 99px; padding: 7px 13px; white-space: nowrap; }
    .header-note::before { content: ''; height: 7px; width: 7px; border-radius: 50%; background: #89aa89; }
    .container { width: min(1160px, calc(100% - 40px)); margin-inline: auto; }
    .hero { padding: 69px 0 41px; }
    .hero-box { display: grid; grid-template-columns: minmax(0, 1fr) 295px; align-items: center; gap: 18px; }
    .eyebrow { display: inline-flex; color: #5c6658; font-weight: 800; letter-spacing: .06em; font-size: 13px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .hero h1 { font-size: clamp(33px, 4.4vw, 55px); letter-spacing: -.075em; line-height: 1.35; margin: 12px 0 18px; font-weight: 800; }
    .hero h1 em { font-style: normal; color: #ad7142; }
    .hero-description { max-width: 700px; color: #5a6772; font-size: 18px; margin-bottom: 24px; }
    .hero-notes { display: flex; flex-wrap: wrap; gap: 9px; }
    .hero-notes span { font-weight: 800; font-size: 13px; color: #446264; padding: 5px 13px; border-radius: 100px; background: #e5eeeb; border: 1px solid #d6e4df; }
    .hero-art { position: relative; display: grid; place-items: center; height: 275px; }
    .hero-ring { width: 237px; height: 237px; border-radius: 50%; border: 2px dashed #d3c5ab; display: grid; place-items: center; transform: rotate(-8deg); background: #f5ead6; box-shadow: inset 0 0 0 12px rgba(255, 255, 255, .35); }
    .hero-ring::before, .hero-ring::after { content: '✦'; position: absolute; font-size: 22px; color: #b28659; }
    .hero-ring::before { transform: translate(-116px,-78px); }
    .hero-ring::after { transform: translate(115px,75px); }
    .hero-ring span { font-size: 103px; font-weight: 800; color: #7b6450; letter-spacing: -.15em; transform: rotate(8deg); font-family: Georgia, serif; }
    .hero-stamp { position: absolute; right: 8px; bottom: 5px; color: #fff; background: #a76a54; box-shadow: 0 9px 19px #98746033; width: 91px; height: 91px; border-radius: 23px; transform: rotate(13deg); display: grid; place-items: center; font-size: 16px; font-weight: 900; text-align: center; line-height: 1.45; }
    .section-heading { margin: 0 0 22px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px; }
    .section-heading h2 { font-size: 25px; letter-spacing: -.05em; margin: 0; }
    .section-heading p { color: var(--muted); font-size: 14px; margin: 0; }
    .people-section { padding: 15px 0 81px; }
    .people-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
    .person-card { --person-color: #a66c50; display: block; overflow: hidden; text-decoration: none; border-radius: 22px; border: 1px solid #e4dfd3; background: var(--paper); box-shadow: 0 5px 15px rgba(63, 64, 55, .03); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .person-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: #c9bba3; }
    .card-visual { position: relative; height: 230px; overflow: hidden; background: linear-gradient(180deg, #efe8d7 0%, #e8e0cf 100%); }
    .card-visual img { width: 100%; height: 100%; display: block; object-fit: contain; object-position: center center; transition: transform .25s ease; }
    .person-card:hover img { transform: scale(1.035); }
    .card-counter { position: absolute; top: 17px; left: 17px; padding: 4px 11px; border-radius: 100px; background: rgba(255, 253, 249, .92); color: #586568; font-size: 12px; font-weight: 900; letter-spacing: .05em; backdrop-filter: blur(3px); }
    .card-body { padding: 22px 24px 24px; }
    .card-role { display: block; color: var(--person-color); font-size: 13px; font-weight: 900; margin-bottom: 6px; }
    .card-name { font-size: 29px; letter-spacing: -.055em; line-height: 1.3; font-weight: 900; margin: 0 0 10px; }
    .card-description { min-height: 54px; font-size: 16px; color: #63707b; margin: 0 0 17px; }
    .card-cta { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 900; color: var(--deep-brand); }
    .card-cta .arrow { transition: transform .2s; }
    .person-card:hover .arrow { transform: translateX(5px); }
    .mini-guide { display: flex; align-items: center; gap: 14px; background: #eff2eb; border: 1px solid #dce5d9; border-radius: 20px; padding: 18px 21px; margin-top: 27px; color: #47635b; font-size: 14px; font-weight: 700; }
    .guide-icon { display: grid; place-items: center; background: #d6e4d9; border-radius: 12px; flex: 0 0 43px; height: 43px; font-size: 20px; }
    .mini-guide p { margin: 0; }
    .site-footer { border-top: 1px solid var(--line); padding: 26px 0 40px; background: #f3f0e8; }
    .footer-inner { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: space-between; color: #777c78; font-size: 12px; }
    .footer-inner p { margin: 0; }

    /* 인물 상세 화면 */
    .detail-page { padding: 31px 0 81px; }
    .back-link { display: inline-flex; align-items: center; gap: 9px; color: var(--deep-brand); font-size: 15px; font-weight: 900; text-decoration: none; padding: 9px 4px; margin-bottom: 20px; }
    .back-link:hover, .text-link:hover, .next-link:hover { text-decoration: underline; text-underline-offset: 4px; }
    .detail-head { margin-bottom: 25px; }
    .detail-tag { color: var(--person-color); font-weight: 900; letter-spacing: .035em; font-size: 14px; }
    .detail-head h1 { font-size: clamp(39px, 5.3vw, 61px); letter-spacing: -.085em; line-height: 1.25; margin: 3px 0 7px; }
    .detail-subtitle { color: #5c6871; font-size: 19px; margin: 0; }
    .detail-hero { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); border-radius: 26px; overflow: hidden; background: var(--paper); border: 1px solid #e5dfd5; box-shadow: 0 10px 35px rgba(54, 55, 51, .05); }
    .detail-illustration { position: relative; min-height: 388px; display: flex; justify-content: center; align-items: center; background: var(--person-tint); }
    .detail-illustration img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center center; }
    .portrait-label { position: absolute; left: 14px; bottom: 14px; background: rgba(255,253,247,.89); padding: 5px 11px; border-radius: 50px; color: #646763; font-weight: 800; font-size: 12px; }
    .detail-intro { padding: clamp(27px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; }
    .intro-overline { font-weight: 900; font-size: 13px; color: var(--person-color); margin-bottom: 13px; }
    .detail-intro h2 { font-size: clamp(26px, 3vw, 36px); line-height: 1.35; letter-spacing: -.07em; margin-bottom: 16px; }
    .detail-intro p { color: #596875; font-size: 17px; margin-bottom: 23px; }
    .intro-badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .intro-badges span { display: inline-block; color: #3c5c59; background: #e9f0ed; border: 1px solid #d6e4db; font-weight: 800; font-size: 13px; border-radius: 100px; padding: 5px 12px; }
    .detail-columns { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, .88fr); gap: 23px; align-items: start; margin-top: 26px; }
    .panel { background: #fffdf9; border: 1px solid #e5dfd5; border-radius: 23px; padding: 29px 30px; }
    .panel h2 { font-size: 24px; letter-spacing: -.06em; margin: 0 0 18px; }
    .achievements { display: grid; gap: 22px; }
    .achievement { display: grid; grid-template-columns: 43px minmax(0,1fr); gap: 14px; }
    .achievement-num { width: 40px; height: 40px; border-radius: 13px; background: #f2ebe0; color: #9e6947; font-size: 18px; font-weight: 900; display: grid; place-items: center; }
    .achievement h3 { font-size: 18px; letter-spacing: -.04em; margin: 1px 0 6px; }
    .achievement p { color: #586875; font-size: 16px; margin: 0; }
    .glossary-title { font-size: 13px; font-weight: 900; color: #a0714a; margin-bottom: 9px; }
    .glossary-content { font-size: 16px; color: #55636e; margin-bottom: 0; }
    .aside-divider { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
    .thinking-label { color: #507572; font-size: 13px; font-weight: 900; margin-bottom: 7px; }
    .thinking-content { font-size: 17px; font-weight: 800; line-height: 1.65; margin-bottom: 0; }
    .note-panel { background: #f5f0e7; border: 1px solid #e3d6c2; border-radius: 23px; padding: 29px 30px; margin-top: 24px; }
    .note-label { font-weight: 900; font-size: 13px; color: #9b714e; }
    .note-panel h2 { font-size: 23px; letter-spacing: -.055em; margin: 5px 0 10px; }
    .note-panel p { color: #5f696c; margin-bottom: 0; }
    .summary-quote { margin: 20px 0; padding: 16px 18px; border-radius: 13px; background: #fffdf9; border-left: 5px solid var(--accent); font-size: 17px; font-weight: 900; line-height: 1.75; color: #334957; }
    .copy-button { display: inline-flex; align-items: center; gap: 9px; background: var(--deep-brand); color: #fff; border: 0; cursor: pointer; border-radius: 12px; padding: 10px 18px; font-size: 14px; font-weight: 900; transition: background .15s ease; }
    .copy-button:hover { background: #386b72; }
    .copy-status { margin: 8px 0 0; display: inline-block; font-size: 13px; font-weight: 800; color: #38685c; }
    .source-line { color: #77786f; font-size: 13px; margin: 22px 0 32px; }
    .text-link { color: var(--deep-brand); text-underline-offset: 3px; font-weight: 800; }
    .next-people { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-top: 1px solid var(--line); padding-top: 23px; }
    .next-link { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; color: #3d605d; font-size: 15px; font-weight: 900; padding: 7px 0; }

    @media (max-width: 900px) {
      .hero-box { grid-template-columns: minmax(0,1fr) 230px; }
      .hero-art { height: 240px; }
      .hero-ring { width: 195px; height: 195px; }
      .hero-ring span { font-size: 82px; }
      .hero-stamp { width: 71px; height: 71px; font-size: 13px; border-radius: 17px; }
      .people-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .detail-columns { grid-template-columns: minmax(0,1fr); }
      .glossary-side { display: grid; grid-template-columns: 1fr 1fr; gap: 23px; }
      .glossary-side .aside-divider { display: none; }
    }
    @media (max-width: 620px) {
      body { font-size: 16px; }
      .container, .header-inner { width: min(100% - 30px, 1160px); }
      .header-inner { min-height: 76px; }
      .brand-mark { flex-basis: 38px; height: 38px; font-size: 20px; }
      .brand-text strong { font-size: 18px; }
      .header-note { display: none; }
      .hero { padding: 42px 0 20px; }
      .hero-box { display: block; }
      .hero h1 { font-size: 35px; }
      .hero-description { font-size: 16px; }
      .hero-art { display: none; }
      .section-heading { display: block; }
      .section-heading p { margin-top: 4px; }
      .people-grid { grid-template-columns: minmax(0,1fr); gap: 17px; }
      .card-visual { height: 235px; }
      .card-description { min-height: auto; }
      .people-section { padding-bottom: 53px; }
      .detail-page { padding-top: 16px; }
      .back-link { margin-bottom: 15px; }
      .detail-head h1 { font-size: 45px; }
      .detail-subtitle { font-size: 17px; }
      .detail-hero { grid-template-columns: minmax(0,1fr); }
      .detail-illustration { height: 302px; min-height: 0; }
      .detail-intro { padding: 25px 24px 28px; }
      .detail-intro h2 { font-size: 29px; }
      .detail-intro p { font-size: 16px; }
      .detail-columns { margin-top: 17px; gap: 17px; }
      .panel, .note-panel { padding: 23px 22px; }
      .glossary-side { display: block; }
      .glossary-side .aside-divider { display: block; }
      .note-panel { margin-top: 17px; }
      .achievement { grid-template-columns: 36px 1fr; gap: 11px; }
      .achievement-num { width: 34px; height: 34px; font-size: 16px; }
      .next-people { gap: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .person-card, .card-visual img, .card-cta .arrow { transition: none; }
    }
  </style>
</head>

  <script>
    "use strict";

    /*
      ===== 선생님이 수정하기 쉬운 영역 =====

      image: "images/새로운사진.jpg"처럼 경로를 바꾸세요.
    */
    const PEOPLE = [
      {
        id: "wanggeon", name: "왕건", number: "01", role: "고려의 첫 번째 왕", period: "918~943년 재위",
        title: "고려를 세우고 나라를 하나로 모았어요",
        description: "고려를 세우고 후삼국 통일을 이끈 임금",
        intro: "왕건은 후삼국으로 나뉘어 있던 나라를 하나로 모으고 고려의 기틀을 닦은 첫 번째 왕이에요.",

        ],
        word: "호족", meaning: "지방에서 큰 세력을 가지고 있던 사람들",
        thinking: "왕건은 나라를 하나로 모으기 위해 어떤 노력을 했을까요?",

      {

    const app = document.getElementById("app");
    const byId = Object.fromEntries(PEOPLE.map(person => [person.id, person]));

    function makeCard(person) {
      return `
        <a href="#/person/${person.id}" class="person-card" style="--person-color:${person.color}" aria-label="${person.name}의 업적 자세히 알아보기">
          <div class="card-visual">
            <img src="${person.image}" alt="${person.name} ${person.imageType || '인물 그림'}" loading="eager" width="720" height="800" />
            <span class="card-counter">인물 ${person.number}</span>
          </div>
          <div class="card-body">
            <span class="card-role">${person.role}</span>
            <h3 class="card-name">${person.name}</h3>
            <p class="card-description">${person.description}</p>
            <span class="card-cta">업적 알아보기 <span class="arrow" aria-hidden="true">→</span></span>
          </div>
        </a>`;
    }

    function renderHome() {
      document.title = "고려 역사 인물 탐험 | 5학년 역사 조사";
      app.innerHTML = `
        <section class="hero" aria-labelledby="home-title">
          <div class="hero-box">
            <div>
              <span class="eyebrow">GORYEO · HISTORY EXPLORER</span>
              <h1 id="home-title">고려 시대의 <em>멋진 인물</em>,<br />누가 있었을까요?</h1>
              <p class="hero-description">여섯 인물의 이름을 눌러 어떤 일을 했는지 살펴보세요.<br />그중 중요한 업적을 찾아 나만의 역사 인물 카드를 완성해 봅시다.</p>
              <div class="hero-notes" aria-label="활동 순서">
                <span>① 인물 고르기</span><span>② 업적 살펴보기</span><span>③ 역사 카드 만들기</span>
              </div>
            </div>
            <div class="hero-art" aria-hidden="true">
              <div class="hero-ring"><span>高麗</span></div><div class="hero-stamp">6명의<br />인물 탐구</div>
            </div>
          </div>
        </section>
        <section class="people-section" aria-labelledby="people-heading">
          <div class="section-heading">
            <h2 id="people-heading">누구를 조사해 볼까요?</h2>
            <p>궁금한 인물을 선택해 보세요. · 총 6명</p>
          </div>
          <div class="people-grid">${PEOPLE.map(makeCard).join("")}</div>
          <div class="mini-guide">
            <span class="guide-icon" aria-hidden="true">✎</span>
            <p><strong>역사 탐구 팁!</strong> 인물 카드에는 이름과 함께 <strong>가장 중요한 업적 1~2개</strong>를 내 말로 적어 보세요.</p>
          </div>
        </section>`;
    }

    function renderDetail(person) {
      document.title = `${person.name}의 업적 | 고려 역사 인물 탐험`;
      const index = PEOPLE.findIndex(item => item.id === person.id);
      const prev = PEOPLE[(index - 1 + PEOPLE.length) % PEOPLE.length];
      const next = PEOPLE[(index + 1) % PEOPLE.length];
      app.innerHTML = `
        <article class="detail-page" style="--person-color:${person.color};--person-tint:${person.tint}">
          <a class="back-link" href="#/">← 여섯 인물 목록으로 돌아가기</a>
          <header class="detail-head">
            <span class="detail-tag">${person.role} · ${person.period}</span>
            <h1>${person.name}</h1>
            <p class="detail-subtitle">${person.description}</p>
          </header>
          <section class="detail-hero" aria-label="${person.name} 소개">
            <div class="detail-illustration">
              <img src="${person.image}" alt="${person.name} ${person.imageType || '인물 그림'}" width="720" height="800" />
              <span class="portrait-label">${person.imageType || "인물 그림"}</span>
            </div>
            <div class="detail-intro">
              <span class="intro-overline">이 인물을 소개합니다</span>
              <h2>${person.title}</h2>
              <p>${person.intro}</p>
              <div class="intro-badges" aria-label="핵심 단어">${person.tags.map(tag => `<span># ${tag}</span>`).join("")}</div>
            </div>
          </section>
          <div class="detail-columns">
            <section class="panel" aria-labelledby="achievements-title">
              <h2 id="achievements-title">대표 업적 3가지</h2>
              <div class="achievements">
                ${person.achievements.map((item, i) => `
                  <div class="achievement">
                    <span class="achievement-num" aria-label="${i + 1}번">${i + 1}</span>
                    <div><h3>${item.title}</h3><p>${item.content}</p></div>
                  </div>`).join("")}
              </div>
            </section>
            <aside class="panel glossary-side" aria-label="학습 도움말">
              <div>
                <div class="glossary-title">📖 어려운 낱말 알아보기</div>
                <p class="glossary-content"><strong>${person.word}</strong> : ${person.meaning}</p>
              </div>
              <hr class="aside-divider" />
              <div>
                <div class="thinking-label">💭 생각해 볼 문제</div>
                <p class="thinking-content">${person.thinking}</p>
              </div>
            </aside>
          </div>
          <section class="note-panel" aria-labelledby="card-note-title">
            <span class="note-label">HISTORY CARD NOTE</span>
            <h2 id="card-note-title">인물 카드에는 이렇게 정리할 수 있어요</h2>
            <p>아래 문장을 참고하되, 가능하면 <strong>내가 이해한 말</strong>로 바꾸어 적어 보세요.</p>
            <blockquote class="summary-quote" id="summary-quote">${person.summary}</blockquote>
            <button type="button" id="copy-button" class="copy-button" aria-describedby="copy-status">⧉ 핵심 문장 복사하기</button>
            <span id="copy-status" class="copy-status" role="status" aria-live="polite"></span>
          </section>
          <p class="source-line">내용 참고: 국사편찬위원회 우리역사넷 · <a class="text-link" href="${person.source}" target="_blank" rel="noopener noreferrer">원문에서 더 알아보기 ↗</a></p>
          <nav class="next-people" aria-label="다른 인물로 이동">
            <a class="next-link" href="#/person/${prev.id}">← 이전 인물 · ${prev.name}</a>
            <a class="next-link" href="#/person/${next.id}">다음 인물 · ${next.name} →</a>
          </nav>
        </article>`;
      document.getElementById("copy-button").addEventListener("click", () => copySummary(person.summary));
    }

    async function copySummary(text) {
      const status = document.getElementById("copy-status");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const field = document.createElement("textarea");
          field.value = text;
          field.setAttribute("readonly", "");
          field.style.cssText = "position:fixed;top:-1000px;left:-1000px;";
          document.body.appendChild(field);
          field.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(field);
          if (!ok) throw new Error("clipboard unavailable");
        }
        if (status) status.textContent = "복사했어요!";
      } catch (error) {
        if (status) status.textContent = "복사가 안 되면 위 문장을 직접 선택해 복사해 주세요.";
      }
    }

    function showPage() {
      // URL의 # 뒤에서 인물 ID를 읽으므로 GitHub Pages에서도 새로고침이 가능합니다.
      const route = decodeURIComponent(location.hash.slice(1));
      if (route.startsWith("/person/")) {
        const id = route.slice("/person/".length);
        const person = byId[id];
        if (person) renderDetail(person);
        else renderHome();
      } else {
        renderHome();
      }
      window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    }

    // 해시 기반 인물 이동과 별개로 키보드 이용자의 본문 건너뛰기를 지원합니다.
    document.querySelector(".skip").addEventListener("click", event => {
      event.preventDefault();
      document.getElementById("main-content").focus();
    });
    window.addEventListener("hashchange", showPage);
    showPage();
  </script>
